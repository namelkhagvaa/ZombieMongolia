<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold цэнэглэх — Zombie Mongolia</title>
<meta name="theme-color" content="#0a0c12">
<style>
  /* Тоглоомын цонхтой ижил өнгө: бараан самбар, алтан хүрээ, алтан үндсэн товч (src/Account.cpp) */
  :root { --bg: #0a0c12; --panel: rgba(12,16,22,.96); --frame: rgba(255,200,90,.43); --gold: rgb(242,178,48);
          --gold-hi: rgb(255,218,110); --ink: rgb(34,24,6); --text: rgb(242,240,234); --dim: rgba(242,240,234,.62);
          --danger: rgb(235,90,80); --good: rgb(110,200,120); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
               font-family: "Segoe UI", Roboto, Arial, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .card { width: min(440px, 100%); padding: 26px 26px 28px; border-radius: 14px; background: var(--panel);
          border: 1.5px solid var(--frame); box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: .5px; }
  h1 b { color: var(--gold); }
  .sub { margin: 0 0 20px; color: var(--dim); font-size: 14px; }
  label { display: block; margin: 12px 0 6px; font-size: 14px; color: var(--dim); }
  input { width: 100%; height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25);
          background: rgba(0,0,0,.5); color: var(--text); font-size: 17px; outline: none; }
  input:focus { border-color: var(--gold); }
  button { width: 100%; height: 52px; margin-top: 18px; border: 1.5px solid rgba(255,240,190,.78); border-radius: 14px;
           background: var(--gold); color: var(--ink); font-size: 18px; font-weight: 700; cursor: pointer; }
  button:hover { background: var(--gold-hi); }
  button:disabled { opacity: .6; cursor: default; }
  button.secondary { background: rgba(255,255,255,.08); color: var(--text); border-color: rgba(255,255,255,.25); }
  .who { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 15px; }
  .who .gold { color: var(--gold); font-weight: 700; font-size: 18px; }
  .packs { display: grid; gap: 10px; }
  .pack { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-radius: 12px;
          border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04); cursor: pointer; }
  .pack:hover, .pack.selected { border-color: var(--gold); background: rgba(242,178,48,.12); }
  .pack .g { font-size: 20px; font-weight: 700; color: var(--gold); }
  .pack .p { font-size: 16px; }
  .qr { display: block; width: 220px; height: 220px; margin: 8px auto 12px; border-radius: 10px; background: #fff; }
  .banks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .banks a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 10px;
             background: rgba(255,255,255,.06); color: var(--text); text-decoration: none; font-size: 12px; text-align: center; }
  .banks img { width: 40px; height: 40px; border-radius: 10px; }
  .msg { margin-top: 14px; min-height: 20px; font-size: 14px; color: var(--dim); text-align: center; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--good); font-weight: 600; }
  .hidden { display: none; }
  .link { display: block; margin-top: 14px; text-align: center; color: var(--gold); font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <h1>ZOMBIE <b>MONGOLIA</b></h1>
  <p class="sub">Gold цэнэглэх · тоглоомын данс (утас, нууц үг)</p>

  <form id="login">
    <label for="phone">Утасны дугаар</label>
    <input id="phone" inputmode="numeric" autocomplete="tel" maxlength="8" placeholder="99112233" required>
    <label for="password">Нууц үг</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="loginButton" type="submit">НЭВТРЭХ</button>
  </form>

  <div id="shop" class="hidden">
    <div class="who"><span id="name"></span><span class="gold" id="gold"></span></div>
    <div class="packs" id="packs"></div>
    <button id="buy" disabled>ТӨЛӨХ</button>
  </div>

  <div id="pay" class="hidden">
    <p class="sub" id="payText"></p>
    <img class="qr" id="qr" alt="QPay QR">
    <div class="banks" id="banks"></div>
    <span class="link" id="back">← Буцах</span>
  </div>

  <div class="msg" id="msg"></div>
</div>
<script>
  // Тоглоомын API (/api/): вэб нэвтрэлт нь тоглоом дээрх нэвтрэлтийг гаргахгүй, төхөөрөмж бүртгэхгүй.
  var api = location.pathname.replace(/topup\/?$/, '');
  var token = '', packs = [], selected = -1, invoiceId = 0, pollTimer = 0;
  var $ = function (id) { return document.getElementById(id); };

  function show(id) { ['login', 'shop', 'pay'].forEach(function (s) { $(s).classList.toggle('hidden', s !== id); }); }
  function message(text, kind) { var m = $('msg'); m.textContent = text || ''; m.className = 'msg' + (kind ? ' ' + kind : ''); }
  function money(n) { return n.toLocaleString('mn-MN') + '₮'; }

  function call(method, path, body) {
    var headers = { 'Content-Type': 'application/json' };
    if (token) headers.Authorization = 'Bearer ' + token;
    return fetch(api + path, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok || !j.ok) throw new Error(j.message || ('Алдаа (' + r.status + ')'));
        return j;
      }); });
  }

  function setGold(gold) { $('gold').textContent = gold.toLocaleString('mn-MN') + ' Gold'; }

  function renderPacks() {
    var box = $('packs');
    box.innerHTML = '';
    packs.forEach(function (pack, i) {
      var row = document.createElement('div');
      row.className = 'pack' + (i === selected ? ' selected' : '');
      row.innerHTML = '<span class="g"></span><span class="p"></span>';
      row.querySelector('.g').textContent = pack.gold.toLocaleString('mn-MN') + ' Gold';
      row.querySelector('.p').textContent = money(pack.price);
      row.onclick = function () { selected = i; renderPacks(); $('buy').disabled = false; };
      box.appendChild(row);
    });
  }

  $('login').onsubmit = function (e) {
    e.preventDefault();
    $('loginButton').disabled = true;
    message('Нэвтэрч байна...');
    call('POST', 'web/login/', { phone: $('phone').value, password: $('password').value }).then(function (j) {
      token = j.token;
      packs = j.packs;
      $('name').textContent = j.name;
      setGold(j.gold);
      renderPacks();
      show('shop');
      message('Багцаа сонгоно уу');
    }).catch(function (err) { message(err.message, 'error'); }).finally(function () { $('loginButton').disabled = false; });
  };

  $('buy').onclick = function () {
    if (selected < 0) return;
    $('buy').disabled = true;
    message('Нэхэмжлэх үүсгэж байна...');
    call('POST', 'invoices/', { kind: 'gold', pack: packs[selected].index, platform: 'web' }).then(function (j) {
      var inv = j.invoice;
      invoiceId = inv.id;
      $('payText').textContent = packs[selected].gold.toLocaleString('mn-MN') + ' Gold · ' + money(inv.amount) +
        ' — QR кодыг банкны аппаараа уншуулах эсвэл банкаа сонгоно уу';
      $('qr').src = inv.qr_image ? 'data:image/png;base64,' + inv.qr_image : '';
      var banks = $('banks');
      banks.innerHTML = '';
      (inv.urls || []).forEach(function (b) {
        var a = document.createElement('a');
        a.href = b.link;
        a.innerHTML = '<img alt=""><span></span>';
        a.querySelector('img').src = b.logo || '';
        a.querySelector('span').textContent = b.name || b.description || '';
        banks.appendChild(a);
      });
      show('pay');
      message('Төлбөр хүлээж байна...');
      clearInterval(pollTimer);
      pollTimer = setInterval(poll, 4000);
    }).catch(function (err) { message(err.message, 'error'); $('buy').disabled = false; });
  };

  function poll() {
    call('GET', 'invoices/' + invoiceId + '/').then(function (j) {
      if (j.invoice.status === 'paid' && j.invoice.applied) {
        clearInterval(pollTimer);
        setGold(j.account.gold);
        show('shop');
        $('buy').disabled = selected < 0;
        message('Төлбөр орлоо: ' + j.invoice.gold.toLocaleString('mn-MN') + ' Gold нэмэгдлээ', 'ok');
      } else if (j.invoice.status === 'cancelled') {
        clearInterval(pollTimer);
        show('shop');
        $('buy').disabled = selected < 0;
        message('Нэхэмжлэх цуцлагдсан', 'error');
      }
    }).catch(function () {});
  }

  $('back').onclick = function () { clearInterval(pollTimer); show('shop'); $('buy').disabled = selected < 0; message(''); };
</script>
</body>
</html>
