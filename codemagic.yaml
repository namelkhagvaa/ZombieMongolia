# iOS build (Mac-гүйгээр: Codemagic-ийн macOS сервер дээр Xcode). Эхний шат: симулятор (гарын үсэггүй) build.
# Алдаа гарсан ч алдааны мөрүүдийг errors.txt-д цуглуулж артефакт болгоно (build.log бүтнээрээ хамт).
workflows:
  ios-simulator:
    name: iOS simulator build
    instance_type: mac_mini_m2
    max_build_duration: 90
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios
          include: true
    environment:
      xcode: latest
    scripts:
      - name: Build
        script: |
          command -v cmake >/dev/null || brew install cmake
          cmake --version | head -1
          status=0
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 > configure.log 2>&1 || status=1
          if [ $status -eq 0 ]; then
            cmake --build build-ios --config Release --target ZombieMongolia -- \
              -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || status=1
          fi
          touch build.log
          {
            echo "status: $status"
            for log in configure.log build.log; do
              echo "===== $log: errors"
              grep -E "error:|Error:|CMake Error|fatal error|Undefined symbols|ld: " "$log" \
                | sed -E "s#^$PWD/##" | awk '!seen[$0]++' | head -80
              echo "===== $log: details"
              grep -E -A4 "Undefined symbols|CMake Error" "$log" | head -60
              echo "===== $log: tail"
              tail -30 "$log"
            done
          } > errors.txt
          cat errors.txt
          exit $status
    artifacts:
      - errors.txt
      - configure.log
      - build.log

  # iPhone-д: гарын үсэгтэй .ipa -> App Store Connect (TestFlight). Гараар л эхлүүлнэ (Start new build).
  # Codemagic-д: Developer Portal integration "ZombieMongolia ASC" (App Store Connect API түлхүүр), Code signing
  # identities-д Apple Distribution гэрчилгээ ба mn.zombiemongolia.game-ийн App Store profile.
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: ZombieMongolia ASC
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: mn.zombiemongolia.game
    scripts:
      - name: Configure
        script: |
          command -v cmake >/dev/null || brew install cmake
          # CFBundleVersion: Codemagic-ийн build-ийн дугаар (App Store Connect илгээх бүрд өсөх ёстой)
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON \
            -DZM_IOS_BUILD_NUMBER=$BUILD_NUMBER
      - name: Signing
        script: xcode-project use-profiles --project build-ios/ZombieMongolia.xcodeproj
      - name: Build ipa
        script: |
          status=0
          xcode-project build-ipa \
            --project build-ios/ZombieMongolia.xcodeproj \
            --scheme ZombieMongolia \
            --config Release || status=$?
          if [ $status -ne 0 ]; then
            # Алдаатай үед: xcodebuild-ийн log-оос алдааны мөрүүдийг шууд харуулна (errors.txt артефакт ч болно)
            {
              echo "===== errors"
              cat /tmp/xcodebuild_logs/*.log 2>/dev/null \
                | grep -E "error:|fatal error|Undefined symbols|ld: |No profile|Provisioning|requires a provisioning" \
                | sed -E "s#^$PWD/##" | awk '!seen[$0]++' | head -80
              echo "===== details"
              cat /tmp/xcodebuild_logs/*.log 2>/dev/null | grep -E -A6 "Undefined symbols" | head -40
              echo "===== tail"
              cat /tmp/xcodebuild_logs/*.log 2>/dev/null | tail -40
            } > errors.txt
            cat errors.txt
          fi
          exit $status
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - errors.txt
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
