<!-- Нүүр дэлгэцэд нэмбэл (Add to Home Screen) апп шиг бүтэн дэлгэцээр, хэвтээ нээгдэнэ: iPhone-ий Safari
     хуудсыг өөр аргаар бүтэн дэлгэц болгодоггүй. -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zombie MN">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#000000">
<style>
  html, body { margin: 0; height: 100%; background: #0a0c12; color: #e8e4da; font-family: "Segoe UI", Arial, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas#canvas { display: block; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; width: 100vw; height: auto; outline: none; background: #000; }
  @media (min-aspect-ratio: 16/9) { canvas#canvas { width: auto; height: 100vh; } }
  /* Ачааллын дэлгэц: тоглоомын эхлэлийн дэлгэцтэй (src/Splash.cpp) яг ижил — зураг, доод сүүдэр, алтан зурвас.
     Хэмжээсүүд нь 720 өндөрт тооцсон пикселийг canvas-ийн өндөрт (cqh) хувиргасан. Файл татах нь 0..50%,
     дараа нь тоглоом өөрөө 50..100% үргэлжлүүлж, анхны кадраа зурмагц энэ дэлгэцийг нууна. */
  @font-face { font-family: "ZmUi"; src: url("ui_font.ttf"); }
  #loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; z-index: 2; }
  #frame { position: relative; aspect-ratio: 16 / 9; width: 100vw; max-height: 100vh; container-type: size; overflow: hidden;
           background: #000 url("splash.png") center / cover no-repeat; font-family: "ZmUi", "Segoe UI", Arial, sans-serif; }
  @media (min-aspect-ratio: 16/9) { #frame { width: auto; height: 100vh; } }
  #frame::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 20.83cqh;
                  background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.8)); }
  #bar { position: absolute; z-index: 1; left: 50%; transform: translateX(-50%); bottom: 5.28cqh; width: min(60cqw, 105.6cqh);
         height: 1.11cqh; border-radius: 1cqh; background: rgba(255,255,255,.16); }
  #fill { position: relative; height: 100%; min-width: 1.11cqh; width: 0; border-radius: 1cqh; background: rgb(255,192,64); transition: width .2s; }
  #fill::after { content: ""; position: absolute; left: 2px; right: 2px; top: 1px; height: 35%; border-radius: 1cqh; background: rgba(255,255,255,.18); }
  #row { position: absolute; z-index: 1; left: 50%; transform: translateX(-50%); bottom: calc(5.28cqh + 1.11cqh + 1.4cqh);
         width: min(60cqw, 105.6cqh); display: flex; justify-content: space-between; font-size: 2.22cqh; line-height: 1; }
  #status { color: rgb(242,240,234); }
  #percent { color: rgb(255,192,64); font-weight: 700; }
  #fs { position: fixed; right: 12px; bottom: 12px; z-index: 3; padding: 8px 12px; border: 0; border-radius: 6px; background: rgba(20,24,32,.75); color: #e8e4da; font: inherit; font-size: 13px; cursor: pointer; }
  /* Утас: хуудас гүйлгэх, томруулахыг хааж бүх хүрэлтийг тоглоомд өгнө */
  html, body, canvas#canvas { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* iPhone: бүтэн дэлгэц болох цорын ганц арга — нүүр дэлгэцэд нэмэх зөвлөмж */
  #iosHint { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 3;
             display: none; align-items: center; gap: 10px; max-width: calc(100vw - 32px); padding: 8px 8px 8px 14px;
             border-radius: 12px; background: rgba(10,13,19,.88); border: 1px solid rgba(255,192,64,.5); color: rgb(242,240,234);
             font-family: "ZmUi", "Segoe UI", Arial, sans-serif; font-size: 14px; line-height: 1.3; }
  #iosHint svg { flex: none; width: 18px; height: 22px; vertical-align: -4px; }
  #iosHint b { color: rgb(255,192,64); font-weight: 700; }
  #iosHint button { flex: none; width: 30px; height: 30px; border: 0; border-radius: 8px; background: rgba(255,255,255,.12);
                    color: inherit; font-size: 16px; }
  #error { position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center;
           gap: 14px; padding: 0 24px; background: rgba(6,8,12,.94); text-align: center; font-size: 15px; line-height: 1.5; }
  #error b { color: rgb(255,192,64); font-size: 18px; }
  #error button { padding: 10px 18px; border: 0; border-radius: 8px; background: rgb(255,192,64); color: #111; font: inherit; font-weight: 700; }
  #debug { position: fixed; left: 0; top: 0; z-index: 6; display: none; max-width: 70vw; max-height: 60vh; overflow: hidden;
           padding: 6px 8px; background: rgba(0,0,0,.72); color: #9fe39f; font: 11px/1.35 monospace; white-space: pre-wrap;
           pointer-events: none; }
  /* Утас босоо: хар дэлгэц мэт харагдахгүйн тулд тоглоомын зургийг дэвсгэр болгож, эргэдэг утасны тэмдэг харуулна */
  #rotate { position: fixed; inset: 0; z-index: 4; display: none; flex-direction: column; align-items: center; justify-content: center;
            gap: 22px; padding: 0 24px; text-align: center; font-family: "ZmUi", "Segoe UI", Arial, sans-serif; font-size: 20px;
            color: rgb(242,240,234); background: linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.75)), #000 url("splash.png") center / cover no-repeat; }
  #rotate .icon { width: 44px; height: 76px; border: 4px solid rgb(255,192,64); border-radius: 10px; animation: zm-rotate 2s ease-in-out infinite; }
  @keyframes zm-rotate { 0%, 20% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  @media (pointer: coarse) {
    #fs { display: none; } /* утсан дээр анхны хүрэлтээр бүтэн дэлгэц болно */
    @media (orientation: portrait) { #rotate { display: flex; } }
  }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="loader"><div id="frame">
  <div id="row"><span id="status">Ачаалж байна...</span><span id="percent">0%</span></div>
  <div id="bar"><div id="fill"></div></div>
</div></div>
<button id="fs" title="Бүтэн дэлгэц">⛶ Бүтэн дэлгэц</button>
<div id="iosHint">
  <span>Бүтэн дэлгэцээр тоглох бол:
    <svg viewBox="0 0 18 22" fill="none" stroke="rgb(255,192,64)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 14V2M5 5.5 9 1.5l4 4M6 9H3.5A1.5 1.5 0 0 0 2 10.5v8A1.5 1.5 0 0 0 3.5 20h11a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 14.5 9H12"/>
    </svg>
    → <b>Add to Home Screen</b></span>
  <button id="iosHintClose" aria-label="Хаах">✕</button>
</div>
<div id="error"><b>Тоглоом зогслоо</b><div id="errorText"></div><button onclick="location.reload()">Дахин ачаалах</button></div>
<div id="debug"></div>
<div id="rotate"><div class="icon"></div><div>Утсаа хэвтээ болгож эргүүлнэ үү</div></div>
<script>
  var canvas = document.getElementById('canvas');
  var fill = document.getElementById('fill');
  var statusEl = document.getElementById('status');
  var loader = document.getElementById('loader');
  var percentEl = document.getElementById('percent');
  function showProgress(ratio, text) {
    var pct = Math.round(100 * Math.max(0, Math.min(1, ratio)));
    fill.style.width = pct + '%';
    percentEl.textContent = pct + '%';
    if (text) statusEl.textContent = text;
  }
  // ?debug: тоглоомын логийг дэлгэцийн буланд харуулна (утсан дээр консол байхгүй үед шалтгааныг олоход).
  // Олон давтагддаг "амжилттай ачааллаа" мөрүүдийг алгасна.
  var debugEl = document.getElementById('debug');
  var debugOn = new URLSearchParams(location.search).has('debug');
  var debugHeader = [], debugLines = [], debugStatus = '';
  var noisy = /(TEXTURE|VAO|VBO|IMAGE|FILEIO|MODEL|MESH|WAVE|SHADER): \[?.*(loaded|uploaded|generated|Data loaded|Unloaded|successfully)|> (Meshes|Materials) count/;
  function debugLog(text, pinned) {
    if (!debugOn || noisy.test(text)) return;
    if (pinned) debugHeader.push(text);
    else if (text) { debugLines.push(text); if (debugLines.length > 30) debugLines.shift(); }
    // Хайрцагны өндөрт багтах сүүлийн мөрүүд л (өмнө нь шинэ мөрүүд доор тасарч харагддаггүй байсан).
    var fit = Math.max(4, Math.floor(innerHeight * 0.6 / 15) - debugHeader.length * 3 - 3);
    debugEl.textContent = debugHeader.concat([debugStatus, '----'], debugLines.slice(-fit)).join('\n');
  }
  // Тоглоом ажиллаж байгаа эсэх: тоглоом кадр бүрд requestAnimationFrame дууддаг (src/Platform.cpp FrameYield).
  if (debugOn) {
    var debugStart = Date.now(), lastFrames = { raf: 0, timeout: 0 };
    setInterval(function () {
      var mem = typeof wasmMemory !== 'undefined' ? Math.round(wasmMemory.buffer.byteLength / 1048576) : 0;
      var f = Module.zmFrames || { raf: 0, timeout: 0 };
      // frames/s: тоглоомын кадрууд; timeout: requestAnimationFrame ирээгүй тул таймераар үргэлжилсэн кадрууд
      debugStatus = 'time ' + Math.round((Date.now() - debugStart) / 1000) + ' s, frames/s ' +
                    Math.round((f.raf + f.timeout - lastFrames.raf - lastFrames.timeout) / 2) +
                    ' (timeout ' + (f.timeout - lastFrames.timeout) + '), memory ' + mem + ' MB, ' +
                    (innerWidth > innerHeight ? 'landscape' : 'portrait') + (document.hidden ? ', hidden' : '');
      lastFrames = { raf: f.raf, timeout: f.timeout };
      debugLog('', false);
    }, 2000);
  }
  if (debugOn) {
    debugEl.style.display = 'block';
    var gl = document.createElement('canvas').getContext('webgl2');
    var info = gl && gl.getExtension('WEBGL_debug_renderer_info');
    debugLog(navigator.userAgent, true);
    debugLog('WebGL2: ' + (gl ? 'yes' : 'NO') + (info ? ', ' + gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : '') +
             (gl ? ', max texture ' + gl.getParameter(gl.MAX_TEXTURE_SIZE) : '') + ', screen ' + screen.width + 'x' + screen.height +
             ' @' + devicePixelRatio, true);
  }
  // Алдааг дэлгэцэнд харуулна (утсан дээр консол байхгүй тул шалтгааныг эндээс уншина).
  function showError(text) {
    debugLog('ERROR: ' + text);
    document.getElementById('errorText').textContent = text;
    document.getElementById('error').style.display = 'flex';
  }
  canvas.addEventListener('webglcontextlost', function (e) {
    e.preventDefault();
    showError('График (WebGL) тасарлаа. Төхөөрөмжийн санах ой хүрэлцээгүй байж магадгүй — бусад tab, апп-аа хаагаад дахин оролдоно уу.');
  }, false);
  canvas.addEventListener('mousedown', function () { canvas.focus(); });
  function enterFullscreen() {
    var el = document.getElementById('stage');
    if (document.fullscreenElement || !el.requestFullscreen) return;
    el.requestFullscreen().then(function () {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
    }).catch(function () {});
  }
  // iPhone-ий зөвлөмж: хаавал энэ төхөөрөмж дээр дахин харуулахгүй; хаагаагүй ч 15 секундын дараа алга болно.
  var iosHint = document.getElementById('iosHint');
  function showIosHint() {
    try { if (localStorage.getItem('ZombieMongolia:iosHintClosed')) return; } catch (e) {}
    iosHint.style.display = 'flex';
    setTimeout(function () { iosHint.style.display = 'none'; }, 15000);
  }
  document.getElementById('iosHintClose').addEventListener('click', function () {
    iosHint.style.display = 'none';
    try { localStorage.setItem('ZombieMongolia:iosHintClosed', '1'); } catch (e) {}
  });
  document.getElementById('fs').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen(); else enterFullscreen();
    canvas.focus();
  });
  // Бүтэн дэлгэц: хөтөч хэрэглэгчийн үйлдэлгүйгээр зөвшөөрдөггүй тул хуудас нээгдмэгц оролдоод, дэлгэцэд анх
  // хүрэх / товших / товч дарах үед шууд оруулна (тусдаа "ТОГЛОХ" товч шаардлагагүй).
  // Утас: хүрэх бүрд (гарчихсан бол буцааж) бүтэн дэлгэц, хэвтээ байрлал. Компьютер: зөвхөн анх удаа (Esc-ээр
  // гарсан бол дахин хүчээр оруулахгүй).
  var touchDevice = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  var fullscreenOnce = false;
  document.addEventListener('fullscreenchange', function () { if (document.fullscreenElement) fullscreenOnce = true; });
  function autoFullscreen() { if (touchDevice || !fullscreenOnce) enterFullscreen(); }
  ['touchend', 'click', 'keydown'].forEach(function (type) {
    document.addEventListener(type, autoFullscreen, { passive: true, capture: true });
  });
  enterFullscreen();
  // Хамтарсан тоглолтын relay сервер (server/relay.js). https:// хуудас (байршуулсан сайт) RELAY_URL-д,
  // http:// хуудас (өөрийн компьютер, дотоод сүлжээ) хуудастай ижил хаягийн 8090 портод холбогдоно.
  // Туршилтад: ?relay=ws://... хаягаар солино. RELAY_URL хоосон бол https сайт дээр хамтарсан тоглолт харагдахгүй.
  var RELAY_URL = 'wss://play-zombie.apps.mn/relay';
  var relayParam = new URLSearchParams(location.search).get('relay');
  var sameHost = 'ws://' + location.hostname + ':8090';
  // Build бүрийн дугаар (tools/build_web.ps1 бичнэ): файлуудыг ?v=... -аар ачаалж, хөтөч хуучин .js-ийг
  // шинэ .wasm-тай хольж ачаалахаас сэргийлнэ (Safari кэшээс хуучин .js өгч "ASM_CONSTS" алдаа гарч байсан).
  var BUILD_ID = '{{{ BUILD_ID }}}';
  var Module = {
    locateFile: function (path) { return path + '?v=' + BUILD_ID; },
    // Туршилт: ?args=--join+1234 гэх мэт тоглоомын командын мөрийн сонголтууд (main.cpp)
    arguments: (new URLSearchParams(location.search).get('args') || '').split(' ').filter(Boolean),
    zmRelayUrl: relayParam || (location.protocol === 'http:' ? sameHost : RELAY_URL),
    canvas: canvas,
    print: function (t) { console.log(t); debugLog(t); },
    printErr: function (t) { console.warn(t); debugLog(t); },
    setStatus: function (text) {
      var m = text.match(/\((\d+(\.\d+)?)\/(\d+)\)/);
      if (m) showProgress(0.5 * parseInt(m[1]) / parseInt(m[3]), 'Файлуудыг татаж байна...');
      else if (!text) showProgress(0.5, 'Тоглоомыг эхлүүлж байна...'); // тоглоомын дэлгэц 50%-аас үргэлжлүүлнэ
    },
    // Тоглоом эхлэлийн дэлгэцийнхээ анхны кадрыг зурмагц дуудна (src/Platform.cpp)
    zmHideLoader: function () { loader.style.display = 'none'; canvas.focus(); },
    // Эхлэлийн дэлгэц дууссан (src/Splash.cpp): iPhone (бүтэн дэлгэцгүй) дээр нүүр дэлгэцэд нэмэх зөвлөмж.
    // Бусад төхөөрөмж анх хүрэхэд бүтэн дэлгэц болно (дээрх autoFullscreen).
    zmLoadingFinished: function () {
      var standalone = navigator.standalone === true ||
                       (window.matchMedia && window.matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches);
      if (standalone || document.fullscreenElement) return;
      if (document.getElementById('stage').requestFullscreen) {
        enterFullscreen();
      } else if (/iPhone|iPod/.test(navigator.userAgent)) {
        showIosHint();
      }
    },
    onAbort: function (what) { showError('Алдаа: ' + what); }
  };
  window.onerror = function (msg) { showError('Алдаа: ' + msg); };
  // Тоглоомын кадар хүлээх (ASYNCIFY) Promise дотор гарсан алдаа window.onerror-т ирдэггүй.
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    showError('Алдаа: ' + (r && (r.stack || r.message) ? (r.message || '') + ' ' + (r.stack || '') : String(r)));
  });
  if (!document.createElement('canvas').getContext('webgl2')) {
    showError('Энэ хөтөч WebGL2 дэмждэггүй. iPhone дээр iOS 15 ба түүнээс шинэ, эсвэл Chrome, Edge-ийн шинэ хувилбар хэрэгтэй.');
  }
</script>
{{{ SCRIPT }}}
</body>
</html>
