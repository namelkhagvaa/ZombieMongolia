<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zombie Mongolia</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0c12; color: #e8e4da; font-family: "Segoe UI", Arial, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas#canvas { display: block; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; width: 100vw; height: auto; outline: none; background: #000; }
  @media (min-aspect-ratio: 16/9) { canvas#canvas { width: auto; height: 100vh; } }
  #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0a0c12; z-index: 2; }
  #loader h1 { margin: 0; font-size: 28px; letter-spacing: 2px; }
  #bar { width: min(420px, 80vw); height: 8px; background: #22262f; border-radius: 4px; overflow: hidden; }
  #fill { width: 0; height: 100%; background: #c9a24a; transition: width .2s; }
  #status { font-size: 14px; color: #a9a497; }
  #fs { position: fixed; right: 12px; bottom: 12px; z-index: 3; padding: 8px 12px; border: 0; border-radius: 6px; background: rgba(20,24,32,.75); color: #e8e4da; font: inherit; font-size: 13px; cursor: pointer; }
  /* Утас: хуудас гүйлгэх, томруулахыг хааж бүх хүрэлтийг тоглоомд өгнө */
  html, body, canvas#canvas { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #rotate { position: fixed; inset: 0; z-index: 4; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #0a0c12; font-size: 16px; text-align: center; padding: 0 16px; }
  #rotate .icon { font-size: 48px; }
  @media (pointer: coarse) {
    #fs { display: none; } /* утсан дээр анхны хүрэлтээр бүтэн дэлгэц болно */
    @media (orientation: portrait) { #rotate { display: flex; } }
  }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="loader">
  <h1>ZOMBIE MONGOLIA</h1>
  <div id="bar"><div id="fill"></div></div>
  <div id="status">Ачаалж байна...</div>
</div>
<button id="fs" title="Бүтэн дэлгэц">⛶ Бүтэн дэлгэц</button>
<div id="rotate"><div class="icon">⟳</div><div>Утсаа хэвтээ болгож эргүүлнэ үү</div></div>
<script>
  var canvas = document.getElementById('canvas');
  var fill = document.getElementById('fill');
  var statusEl = document.getElementById('status');
  var loader = document.getElementById('loader');
  canvas.addEventListener('webglcontextlost', function (e) { statusEl.textContent = 'WebGL алдаа: хуудсыг дахин ачаална уу'; e.preventDefault(); }, false);
  canvas.addEventListener('mousedown', function () { canvas.focus(); });
  function enterFullscreen() {
    var el = document.getElementById('stage');
    if (document.fullscreenElement || !el.requestFullscreen) return;
    el.requestFullscreen().then(function () {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
    }).catch(function () {});
  }
  document.getElementById('fs').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen(); else enterFullscreen();
    canvas.focus();
  });
  // Утас: дэлгэцэд хүрэх бүрд бүтэн дэлгэц, хэвтээ байрлалд оруулна (хөтөч хэрэглэгчийн үйлдлээр л зөвшөөрдөг)
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
    canvas.addEventListener('touchend', enterFullscreen, { passive: true });
  }
  var Module = {
    canvas: canvas,
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (text) {
      var m = text.match(/\((\d+(\.\d+)?)\/(\d+)\)/);
      if (m) {
        var pct = Math.round(100 * parseInt(m[1]) / parseInt(m[3]));
        fill.style.width = pct + '%';
        statusEl.textContent = 'Файлуудыг татаж байна... ' + pct + '%';
      } else if (!text) {
        loader.style.display = 'none';
        canvas.focus();
      }
    },
    onAbort: function (what) { loader.style.display = 'flex'; statusEl.textContent = 'Алдаа гарлаа: ' + what; }
  };
  window.onerror = function (msg) { statusEl.textContent = 'Алдаа гарлаа: ' + msg; };
</script>
{{{ SCRIPT }}}
</body>
</html>
